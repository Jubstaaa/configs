name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - run: bun install --frozen-lockfile
            - run: bunx eslint .
            - run: bunx prettier --check .
            - run: node scripts/doctor.js
            - name: Every preset builds a config
              run: |
                  for preset in base next node library react; do
                      node --input-type=module -e "
                          const { default: build } = await import('./eslint/$preset.js')
                          const blocks = build({ tsconfigRootDir: process.cwd() })
                          if (!Array.isArray(blocks) || blocks.length === 0) {
                              throw new Error('$preset produced no config')
                          }
                          console.log('$preset:', blocks.length, 'blocks')
                      "
                  done
            - name: The package ships what consumers import
              run: |
                  npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
                  node --input-type=module -e "
                      const { readFileSync } = await import('node:fs')
                      const [{ files }] = JSON.parse(
                          readFileSync(process.env.RUNNER_TEMP + '/pack.json', 'utf8')
                      )
                      const { exports: map } = JSON.parse(readFileSync('package.json', 'utf8'))
                      const packed = new Set(files.map(f => f.path))
                      const missing = Object.values(map)
                          .map(p => p.replace('./', ''))
                          .filter(p => !packed.has(p))
                      if (missing.length) throw new Error('declared but not packed: ' + missing.join(', '))
                      console.log('every export is packed:', Object.keys(map).length)
                  "
