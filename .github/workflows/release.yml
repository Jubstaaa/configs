name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Publish an existing tag to npm, for a release whose publish failed. Empty does nothing.'
                type: string
                default: ''

permissions:
    contents: read

jobs:
    release-please:
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        outputs:
            released: ${{ steps.release.outputs.released }}
            tag: ${{ steps.release.outputs.tag }}
        steps:
            - id: release
              uses: Jubstaaa/deploy-actions/release-please@aa44261903bf43dfea30a1292c9cbef3688cd917 # v2.3.0
              with:
                  app-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

    publish:
        needs: release-please
        if: ${{ !cancelled() && (needs.release-please.outputs.released == 'true' || inputs.tag != '') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ inputs.tag || needs.release-please.outputs.tag }}
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - run: npm publish --access public
